name: macOS

# Manual and release-tag runs only: macOS runners are billed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go tests
        run: go test -race ./...
      - name: Windows cross-compile
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null .
      - name: Worker tests
        run: |
          python -m pip install -r worker/requirements.lock
          python -m unittest worker/test_worker.py

  package:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
          - runner: macos-13   # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package
        env:
          PLAYS_PYTHON: python
        run: scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.sha256
