name: macOS

# Manual and release-tag runs only: macOS runners are billed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Go tests
        run: go test -race ./...
      - name: Windows cross-compile
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null .
      - name: Windows 7 edition
        run: scripts/package-win7.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows7
          path: |
            dist/win7/*.zip
            dist/win7/*.sha256

  package:
    needs: test
    # One Apple Silicon runner builds the arm64, x86_64 and universal DMGs.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Package
        run: scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            dist/*.dmg
            dist/*.sha256
